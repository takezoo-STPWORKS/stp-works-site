<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{URL}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{URL}}">
  <meta property="og:image" content="{{URL}}assets/img/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Noto+Sans+JP:wght@500;700&family=Roboto:wght@100;300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- built {{BUILD_DATE}} -->
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="#top" aria-label="STP WORKS ホーム"><img src="assets/img/logo.png" alt="STP WORKS" width="245" height="40"></a>
      <nav class="site-nav" aria-label="メインメニュー">
        <a href="#top">HOME</a>
        <a href="#game">GAME</a>
        <a href="#about">ABOUT</a>
        <a href="#contact">CONTACT</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero" aria-label="最新作">{{HERO}}
    </section>

    <section class="games" id="game">
      <h2 class="section-title">Game</h2>
      <div class="game-grid">{{GAMES}}
      </div>
    </section>

    <section class="about" id="about">
      <h2 class="section-title">ABOUT</h2>
      <dl class="about-list">
          {{ABOUT}}
      </dl>
      <div class="social">
          {{SOCIAL}}
      </div>
    </section>

    <section class="contact" id="contact">
      <h2 class="section-title">CONTACT</h2>
      <p class="contact-text">{{CONTACT}}</p>
    </section>
  </main>

  <footer class="site-footer">
    <nav class="footer-links" aria-label="フッターメニュー">
      <a href="{{PRIVACY_URL}}" target="_blank" rel="noopener">プライバシーポリシー</a>
      <a href="{{PRESSKIT_URL}}" target="_blank" rel="noopener">プレスキット</a>
    </nav>
    <p class="copyright">{{COPYRIGHT}}</p>
  </footer>
</body>
</html>
