<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE_TAG}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{URL}}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  {{SITE_VERIFICATION}}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{TITLE}}">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="{{TITLE_TAG}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{URL}}">
  <meta property="og:image" content="{{URL}}assets/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{TITLE}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="{{TWITTER}}">
  <meta name="twitter:title" content="{{TITLE_TAG}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{URL}}assets/img/og.jpg">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="preload" as="image" href="{{HERO_IMG}}" imagesrcset="{{HERO_SRCSET}}" imagesizes="100vw" fetchpriority="high">
  <script type="application/ld+json">{{JSON_LD}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Noto+Sans+JP:wght@500;700&family=Roboto:wght@100;300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- built {{BUILD_DATE}} -->
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 class="logo"><a href="#top"><img src="assets/img/logo.png" alt="株式会社STP WORKS" width="245" height="40"></a></h1>
      <nav class="site-nav" aria-label="メインメニュー">
        <a href="#top">HOME</a>
        <a href="#game">GAME</a>
        <a href="#about">ABOUT</a>
        <a href="#contact">CONTACT</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero" aria-label="最新作">{{HERO}}
    </section>

    <section class="games" id="game">
      <h2 class="section-title">Game</h2>
      <div class="game-grid">{{GAMES}}
      </div>
    </section>

    <section class="about" id="about">
      <h2 class="section-title">ABOUT</h2>
      <dl class="about-list">
          {{ABOUT}}
      </dl>
      <div class="social">
          {{SOCIAL}}
      </div>
    </section>

    <section class="contact" id="contact">
      <h2 class="section-title">CONTACT</h2>
      <p class="contact-text">{{CONTACT}}</p>
    </section>
  </main>

  <footer class="site-footer">
    <nav class="footer-links" aria-label="フッターメニュー">
      <a href="{{PRIVACY_URL}}" target="_blank" rel="noopener">プライバシーポリシー</a>
      <a href="{{PRESSKIT_URL}}" target="_blank" rel="noopener">プレスキット</a>
    </nav>
    <p class="copyright">{{COPYRIGHT}}</p>
  </footer>
</body>
</html>
